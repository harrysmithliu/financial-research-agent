[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-agent"
version = "0.1.0"
description = "Production-shaped financial research and platform intelligence system."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Harry Liu", email = "harrysmithliu@gmail.com" },
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "langgraph>=0.2,<1.0",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "structlog>=24.4,<25.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.setuptools]
packages = [
    "agents",
    "api",
    "api.routes",
    "config",
    "eval",
    "ingestion",
    "ingestion.sources",
    "llm",
    "mcp_gateway",
    "mcp_server",
    "observability",
    "retrieval",
    "storage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
